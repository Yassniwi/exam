<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Tips Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #1b2a4a;
      --ink-soft: #5b6784;
      --paper: #eef2f8;
      --white: #ffffff;
      --highlight: #ffe066;
      --line: #d5dcea;
      --error: #b3261e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Lexend", "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 760px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    .header {
      padding: 22px 0 16px;
      border-bottom: 2px solid var(--ink);
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header h1 span {
      background: linear-gradient(transparent 55%, var(--highlight) 55%);
      padding: 0 4px;
    }

    .header p {
      color: var(--ink-soft);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--white);
      border: 1px solid var(--line);
      border-left: 5px solid var(--highlight);
    }

    .message.user {
      align-self: flex-end;
      background: var(--ink);
      color: var(--white);
      white-space: pre-wrap;
    }

    .message.error {
      align-self: flex-start;
      background: var(--white);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .message p + p,
    .message p + ul,
    .message p + ol,
    .message ul + p,
    .message ol + p { margin-top: 8px; }

    .message ul, .message ol { padding-left: 20px; }
    .message li + li { margin-top: 4px; }

    .message code {
      background: var(--paper);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.88em;
    }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; padding: 4px 0; }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink-soft);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    /* Suggestions */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
    }

    .suggestions button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .suggestions button:hover { background: var(--highlight); }

    /* Input */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 0 18px;
      border-top: 1px solid var(--line);
    }

    .composer textarea {
      flex: 1;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--ink-soft);
      border-radius: 12px;
      padding: 11px 14px;
      resize: none;
      max-height: 140px;
    }

    .composer button {
      font: inherit;
      font-weight: 500;
      color: var(--white);
      background: var(--ink);
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      cursor: pointer;
    }

    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--highlight);
      outline-offset: 2px;
    }

    @media (max-width: 520px) {
      .message { max-width: 95%; }
      .header h1 { font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <h1><span>Exam Tips</span> Buddy</h1>
      <p>Ask about revision, time management, memory tricks and exam day.</p>
    </header>

    <main class="messages" id="messages">
      <div class="message bot">
        <p>Hi! I'm your exam tips buddy. Tell me which exam you're preparing for and how much time you have, or pick a question below.</p>
      </div>
    </main>

    <div class="suggestions" id="suggestions">
      <button type="button">How do I revise in the last 7 days?</button>
      <button type="button">Best way to memorize quickly?</button>
      <button type="button">How to manage time in the exam hall?</button>
      <button type="button">How do I beat exam stress?</button>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask for an exam tip..." aria-label="Your message"></textarea>
      <button id="send" type="button">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const suggestionsEl = document.getElementById("suggestions");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    let history = [];

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    // Turns the model's simple markdown (bold, lists, headings) into safe HTML.
    function renderMarkdown(text) {
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      for (const rawLine of text.split("\n")) {
        const line = rawLine.trim();
        const bullet = line.match(/^[-*]\s+(.*)/);
        const numbered = line.match(/^\d+[.)]\s+(.*)/);
        const heading = line.match(/^#{1,6}\s+(.*)/);

        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            html += `<${type}>`;
            listType = type;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
        } else if (line === "") {
          closeList();
        } else {
          closeList();
          const content = heading ? `<strong>${formatInline(heading[1])}</strong>` : formatInline(line);
          html += `<p>${content}</p>`;
        }
      }

      closeList();
      return html;
    }

    function addMessage(type, text) {
      const div = document.createElement("div");
      div.className = `message ${type}`;
      if (type === "bot") {
        div.innerHTML = renderMarkdown(text);
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot";
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      inputEl.disabled = busy;
      if (!busy) inputEl.focus();
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message) return;

      suggestionsEl.style.display = "none";
      addMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      setBusy(true);

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage("error", data.error || "Something went wrong. Please try again.");
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "user", text: message });
          history.push({ role: "assistant", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("error", "Could not reach the server. Check your connection and try again.");
      }

      setBusy(false);
    }

    sendBtn.addEventListener("click", () => sendMessage(inputEl.value));

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(inputEl.value);
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    suggestionsEl.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });
  </script>
</body>
</html>
